name: Multi-Repo Playwright Tests (GitHub App - OIDC - File Profile - PTSv1)

# Multi-repo Scenario B — centralized Playwright test orchestration:
# ✅ Checks out smart-tests-multi-repo-demo (book library app + Playwright tests)
# ✅ Records build with --no-commit-collection --commit for BOTH repos
# ✅ Smart Tests correlates book library code changes to test failures
# ✅ File profile (subset file / record tests file)
# ✅ GitHub OIDC auth — no SMART_TESTS_TOKEN secret required
# ⚠️  PTSv1 requires 3-5 observation runs before predictions appear
# 📚 Multi-repo docs: https://docs.cloudbees.com/docs/cloudbees-smart-tests/latest/send-data-to-smart-tests/record-builds/record-builds-from-multiple-repositories

on:
  push:
    branches: [ main, 'patch-playwright-multi-repo-file' ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smart Tests mode'
        required: true
        type: choice
        default: 'observation'
        options:
          - observation
          - production
      optimization_target_type:
        description: 'Optimization target type: target (% of expected duration), confidence (Y-axis probability), time (X-axis fixed budget)'
        required: true
        type: choice
        default: 'target'
        options:
          - target
          - confidence
          - time
      optimization_target_value:
        description: 'Target value — % for target/confidence (e.g. 75%), or duration for time (e.g. 10m)'
        required: true
        default: '75%'
        type: string
      multi_repo_ref:
        description: 'Branch or SHA of smart-tests-multi-repo-demo to test against (default: patch-playwright-multi-repo-file)'
        required: false
        default: 'patch-playwright-multi-repo-file'
        type: string

jobs:
  multi-repo-playwright-file-ptsv1:
    name: Multi-Repo Playwright Tests (File Profile - PTSv1)
    runs-on: runner-robot-demo

    permissions:
      id-token: write
      contents: read

    env:
      EXPERIMENTAL_GITHUB_OIDC_TOKEN_AUTH: 1
      SMART_TESTS_ORGANIZATION: ${{ vars.SMART_TESTS_ORGANIZATION_v1 }}
      SMART_TESTS_WORKSPACE: ${{ vars.SMART_TESTS_WORKSPACE_V1_PLAYWRIGHT_FILE }}
      OBSERVATION_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'observation' && '--observation' || ' ' }}
      TARGET_FLAG: ${{ github.event_name == 'workflow_dispatch' && format('--{0} {1}', inputs.optimization_target_type, inputs.optimization_target_value) || '--target 75%' }}
      SIMULATED_LATENCY_MS: 500

    steps:
    - name: Checkout smart-tests-robot-demo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout smart-tests-multi-repo-demo
      uses: actions/checkout@v4
      with:
        repository: anuddeeph2/smart-tests-multi-repo-demo
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.multi_repo_ref || 'patch-playwright-multi-repo-file' }}
        token: ${{ secrets.MULTI_REPO_PAT }}
        path: multi-repo-app
        fetch-depth: 0

    - name: Get smart-tests-multi-repo-demo commit SHA
      id: multi-repo-sha
      run: echo "sha=$(git -C multi-repo-app rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.1'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r multi-repo-app/requirements.txt
        pip3 install --no-cache-dir smart-tests-cli==2.12.4

    - name: Install Playwright and dependencies
      working-directory: multi-repo-app
      run: |
        npm install
        npx playwright install chromium --with-deps

    - name: Verify Smart Tests connectivity
      run: smart-tests verify || true

    - name: Record commits with Smart Tests
      run: |
        smart-tests record commit --name ${{ github.repository }} --source ${{ github.workspace }} --max-days 90

    - name: Record build with Smart Tests (multi-repo)
      run: |
        smart-tests record build --build ${{ github.run_id }} \
          --no-commit-collection \
          --commit ${{ github.repository }}=${{ github.sha }} \
          --commit anuddeeph2/smart-tests-multi-repo-demo=${{ steps.multi-repo-sha.outputs.sha }}

    - name: Record session with Smart Tests
      run: |
        smart-tests record session --build ${{ github.run_id }} $OBSERVATION_FLAG --test-suite book-library-playwright-multi-repo-file-v1 > session.txt
        cat session.txt
        echo "Mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'observation (default)' }}"
        echo "Target: $TARGET_FLAG"
        echo "Book library SHA: ${{ steps.multi-repo-sha.outputs.sha }}"

    - name: Initialize book library database
      working-directory: multi-repo-app
      run: |
        python -m app.db.init_db
        python -m app.db.seed_data

    - name: Create Smart Tests subset (file profile)
      shell: bash
      run: |
        set +e
        echo "Collecting Playwright spec files for file-profile subsetting..."
        find multi-repo-app/tests/playwright -name "*.spec.ts" | \
          smart-tests subset file --session @session.txt $TARGET_FLAG > smart-tests-subset.txt 2>/tmp/subset-status.txt
        EXIT_CODE=$?
        cat /tmp/subset-status.txt || true
        set -e

        if [ $EXIT_CODE -ne 0 ]; then
          echo "Smart Tests subset failed, falling back to ALL tests"
          echo "ALL" > smart-tests-subset.txt
        fi

        echo "Subset result:"
        cat smart-tests-subset.txt
        echo "Files in subset: $(wc -l < smart-tests-subset.txt)"

    - name: Start book library app and run Playwright tests
      continue-on-error: true
      run: |
        cd multi-repo-app
        DEBUG=False uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        APP_PID=$!

        echo "Waiting for application to start..."
        timeout 30 bash -c 'until curl -f http://localhost:8000/health 2>/dev/null; do sleep 1; done' || {
          echo "Application failed to start"
          kill $APP_PID 2>/dev/null || true
          exit 1
        }
        echo "Application is ready!"

        cd $GITHUB_WORKSPACE
        mkdir -p test-results
        SUBSET_CONTENT=$(cat smart-tests-subset.txt)

        if [ -s smart-tests-subset.txt ] && [ "$SUBSET_CONTENT" != "ALL" ]; then
          echo "Running Playwright with file subset:"
          cat smart-tests-subset.txt
          # Spec paths are multi-repo-app/tests/playwright/... — pass directly to playwright
          cd multi-repo-app
          npx playwright test $(cat $GITHUB_WORKSPACE/smart-tests-subset.txt | sed 's|multi-repo-app/||g' | tr '\n' ' ') || true
          cd $GITHUB_WORKSPACE
        else
          echo "Running all Playwright tests"
          cd multi-repo-app
          npx playwright test || true
          cd $GITHUB_WORKSPACE
        fi

        # Copy results to GITHUB_WORKSPACE/test-results
        cp -r multi-repo-app/test-results/. test-results/ 2>/dev/null || true
        kill $APP_PID 2>/dev/null || true
      env:
        BASE_URL: http://localhost:8000
        DATABASE_URL: sqlite:///./library.db

    - name: Rewrite junit.xml classnames to file paths (required for file profile)
      if: always()
      run: |
        if [ ! -f test-results/playwright-junit.xml ]; then
          echo "Skipping: playwright-junit.xml not found"
          exit 0
        fi
        # Playwright <testsuite file="tests/playwright/api/foo.spec.ts"> — rewrite to
        # multi-repo-app/tests/playwright/... to match the subset paths from find.
        python3 - <<'PYEOF'
        import xml.etree.ElementTree as ET
        import os

        tree = ET.parse('test-results/playwright-junit.xml')
        root = tree.getroot()
        updated = 0

        for testsuite in root.iter('testsuite'):
            # Playwright JUnit uses 'name' (not 'file') for the spec path, relative to testDir
            filepath = testsuite.get('file') or testsuite.get('name', '')
            if not filepath:
                continue
            # testDir is tests/playwright/, so prefix multi-repo-app/tests/playwright/
            rel_path = os.path.normpath(os.path.join('multi-repo-app', 'tests', 'playwright', filepath))
            for tc in testsuite.findall('testcase'):
                tc.set('classname', rel_path)
                tc.set('file', rel_path)
                updated += 1

        print(f"Updated {updated} testcase classname+file attrs to multi-repo-app/... paths")
        tree.write('test-results/junit.xml', xml_declaration=True, encoding='UTF-8')
        PYEOF

    - name: Record test results with Smart Tests (file profile)
      if: always()
      run: |
        if [ -f test-results/junit.xml ]; then
          echo "=== junit.xml first 30 lines ==="
          head -30 test-results/junit.xml
          echo "=== end ==="
          echo "Recording test results to Smart Tests (file profile)..."
          smart-tests record tests file --session @session.txt test-results/junit.xml
          echo "Test results recorded successfully!"
        else
          echo "No junit.xml found"
          ls -la test-results/ || echo "test-results directory not found"
          exit 1
        fi

    - name: Store Test Results for Smart Tests (GitHub App)
      if: always()
      uses: cloudbees-oss/smart-tests-results-upload-action@v1

    - name: Upload Playwright results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-results-multi-repo-file-v1
        path: test-results/
        retention-days: 30

    - name: Display test summary
      if: always()
      run: |
        echo "=== Playwright Test Summary (Multi-Repo File Profile PTSv1) ==="
        echo "smart-tests-robot-demo SHA: ${{ github.sha }}"
        echo "smart-tests-multi-repo-demo SHA: ${{ steps.multi-repo-sha.outputs.sha }}"
        if [ -f test-results/playwright-results.json ]; then
          python3 -c "
        import json
        with open('test-results/playwright-results.json') as f:
            r = json.load(f)
        suites = r.get('suites', [])
        passed = failed = 0
        def count(suites):
            global passed, failed
            for s in suites:
                for spec in s.get('specs', []):
                    for t in spec.get('tests', []):
                        for result in t.get('results', []):
                            if result.get('status') == 'passed': passed += 1
                            else: failed += 1
                count(s.get('suites', []))
        count(suites)
        print(f'{passed} passed, {failed} failed')
          " || echo "Could not parse test results"
        else
          echo "No test results found"
        fi

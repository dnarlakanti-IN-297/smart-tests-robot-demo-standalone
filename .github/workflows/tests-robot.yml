name: Robot Framework Tests

# Smart Tests Integration Status:
# ✅ Test results are recorded in pytest format (JUnit XML transformation)
# ✅ Subset requests are created and visible in CloudBees dashboard
# ⚠️  "Invalid observation session" warning appears because:
#     - Subset requests are created (e.g., 44 of 56 tests)
#     - But all 56 tests are run (not just the 44 subset)
#     - This causes mismatch: Subset 0, Other 56 instead of Subset 44, Other 0
# TODO: Implement Robot Framework subset execution with correct test name format

on:
  push:
    branches: [ main, patch-robot-demo ]
    paths:
      - 'app/**'
      - 'tests/robot/**'
      - 'requirements.txt'
      - 'requirements-robot.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests/robot/**'
      - 'requirements.txt'
      - 'requirements-robot.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smart Tests mode'
        required: true
        type: choice
        default: 'observation'
        options:
          - observation
          - production
      target:
        description: 'Optimization target (e.g., --target 50%)'
        required: false
        default: '--target 80%'
        type: string

jobs:
  robot-api-tests:
    name: Robot Framework API Tests
    runs-on: ubuntu-latest
    env:
      SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
      # Use observation mode unless manually triggered with production mode
      OBSERVATION_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'production' && ' ' || '--observation' }}
      # Use custom target if provided via workflow_dispatch, otherwise default to --target 80%
      TARGET_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.target || '--target 80%' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.1'
        cache: 'pip'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-robot.txt
        pip3 install --no-cache-dir smart-tests-cli~=2.0

    - name: Verify Smart Tests connectivity
      run: |
        smart-tests verify || true

    - name: Record build with Smart Tests
      run: |
        smart-tests record build --build ${{ github.run_id }}

    - name: Record session with Smart Tests
      run: |
        smart-tests record session --build ${{ github.run_id }} $OBSERVATION_FLAG --test-suite robot-api > session.txt
        cat session.txt

    - name: Initialize database
      run: |
        python -m app.db.init_db
        python -m app.db.seed_data

    - name: Collect Robot Framework test names
      run: |
        # Run Robot in dry-run mode to generate test structure
        mkdir -p /tmp/robot-dryrun
        robot --dryrun --outputdir /tmp/robot-dryrun --xunit /tmp/robot-dryrun/junit.xml tests/robot/ || true

        # Extract test names in pytest format for Smart Tests compatibility
        if [ -f "/tmp/robot-dryrun/junit.xml" ]; then
          python3 scripts/extract_robot_tests.py /tmp/robot-dryrun/junit.xml > test_list_robot.txt
        else
          echo "Dry-run failed, cannot proceed without test names"
          exit 1
        fi

        echo "Collected $(wc -l < test_list_robot.txt) test names in pytest format"
        head -10 test_list_robot.txt

    - name: Create Smart Tests subset
      shell: bash
      run: |
        # Use pytest profile with pytest-formatted test names
        set +e  # Temporarily disable exit on error
        echo "Requesting subset from Smart Tests..."
        cat test_list_robot.txt | smart-tests subset pytest --session @session.txt $TARGET_FLAG > smart-tests-subset.txt 2>&1
        EXIT_CODE=$?
        set -e  # Re-enable exit on error

        if [ $EXIT_CODE -ne 0 ]; then
          echo "⚠️  Smart Tests subset command failed with exit code $EXIT_CODE"
          echo "Error output:"
          cat smart-tests-subset.txt
          echo ""
          echo "Falling back to ALL tests"
          echo "ALL" > smart-tests-subset.txt
        fi

        echo "Subset selection result:"
        cat smart-tests-subset.txt
        echo "Number of tests in subset: $(wc -l < smart-tests-subset.txt)"

    - name: Start application and run Robot tests
      continue-on-error: true
      run: |
        # Start application in background
        DEBUG=False uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        APP_PID=$!
        echo "Started application with PID $APP_PID"

        # Wait for application to be ready
        echo "Waiting for application to start..."
        timeout 30 bash -c 'until curl -f http://localhost:8000/health 2>/dev/null; do sleep 1; done' || {
          echo "Application failed to start"
          kill $APP_PID 2>/dev/null || true
          exit 1
        }
        echo "Application is ready!"

        # Run Robot Framework tests
        mkdir -p test-results

        # NOTE: Robot Framework subset execution is complex due to test name format conversion
        # For observation mode, running all tests provides complete data for Smart Tests learning
        # TODO: Implement proper subset execution once format transformation is fully validated

        echo "Running all Robot Framework tests"
        robot \
          --outputdir test-results \
          --output output.xml \
          --log log.html \
          --report report.html \
          --xunit junit.xml \
          --loglevel INFO \
          tests/robot/ || true

        echo "Note: Subset requests are created but all tests are run for complete observation data"

        # Cleanup
        kill $APP_PID 2>/dev/null || true
      env:
        DATABASE_URL: sqlite:///./issue_tracker.db

    - name: Record test results with Smart Tests
      if: always()
      run: |
        if [ -f test-results/junit.xml ]; then
          echo "Transforming Robot Framework JUnit XML to pytest format..."
          python3 scripts/transform_robot_junit.py test-results/junit.xml test-results/junit-transformed.xml

          echo "Recording test results to Smart Tests..."
          smart-tests record tests pytest --session @session.txt test-results/junit-transformed.xml
          echo "✅ Test results recorded to Smart Tests successfully!"
        else
          echo "❌ No JUnit results file found at test-results/junit.xml"
          ls -la test-results/ || echo "test-results directory not found"
          exit 1
        fi

    - name: Upload Robot Framework results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-results
        path: |
          test-results/
        retention-days: 30

    - name: Display test summary
      if: always()
      run: |
        if [ -f test-results/output.xml ]; then
          echo "=== Robot Framework Test Summary ==="
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('test-results/output.xml')
          root = tree.getroot()
          stats = root.find('.//statistics/total/stat')
          if stats is not None:
            print(f\"Total: {stats.get('pass')} passed, {stats.get('fail')} failed\")
          " || echo "Could not parse test results"
        else
          echo "No test results found"
        fi

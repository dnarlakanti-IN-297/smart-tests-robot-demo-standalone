name: Robot Framework Tests with Smart Tests

on:
  push:
    branches: [ main, patch-robot-demo ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smart Tests mode'
        required: true
        type: choice
        default: 'observation'
        options:
          - observation
          - production
      target:
        description: 'Optimization target (e.g., --target 50%)'
        required: false
        default: '--target 80%'
        type: string

jobs:
  robot-api-tests:
    name: Robot Framework API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
      OBSERVATION_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'production' && ' ' || '--observation' }}
      TARGET_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.target || '--target 80%' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-robot.txt
          pip3 install --no-cache-dir smart-tests-cli~=2.0

      - name: Verify Smart Tests connectivity
        run: |
          smart-tests verify || true

      - name: Record build with Smart Tests
        run: |
          smart-tests record build --build ${{ github.run_id }}

      - name: Initialize database
        run: |
          python -m app.db.init_db
          python -m app.db.seed_data

      - name: Start application
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Application failed to start"
          exit 1

      - name: Record session for Robot tests
        run: |
          smart-tests record session --build ${{ github.run_id }} $OBSERVATION_FLAG --test-suite robot-api > session-robot.txt
          cat session-robot.txt

      - name: Generate Robot test list
        run: |
          robot --dryrun --outputdir /tmp tests/robot/ 2>&1 | grep -E "^\S+\.\S+\s+::" | awk '{print $1}' > test_list_robot.txt
          cat test_list_robot.txt

      - name: Create Smart Tests subset for Robot tests
        run: |
          cat test_list_robot.txt | smart-tests subset robot --session @session-robot.txt $TARGET_FLAG > smart-tests-subset-robot.txt
          cat smart-tests-subset-robot.txt

      - name: Run Robot Framework tests (Smart Tests subset)
        continue-on-error: true
        run: |
          if [ -s smart-tests-subset-robot.txt ]; then
            # Read subset and create include pattern
            INCLUDE_PATTERN=$(cat smart-tests-subset-robot.txt | tr '\n' ':' | sed 's/:$//')
            if [ -n "$INCLUDE_PATTERN" ]; then
              robot \
                --outputdir results \
                --output output.xml \
                --log log.html \
                --report report.html \
                --loglevel INFO \
                --include "$INCLUDE_PATTERN" \
                tests/robot/
            else
              echo "Empty subset pattern, running all tests"
              robot \
                --outputdir results \
                --output output.xml \
                --log log.html \
                --report report.html \
                --loglevel INFO \
                tests/robot/
            fi
          else
            echo "No tests to run in subset"
            mkdir -p results
            echo '<?xml version="1.0" encoding="UTF-8"?><robot generator="Robot 7.0" generated="2025-01-01T00:00:00.000000" rpa="false" schemaversion="5"><suite id="s1" name="Empty"><status status="PASS" start="2025-01-01T00:00:00.000000" elapsed="0.000"></status></suite><statistics><total><stat pass="0" fail="0" skip="0">All Tests</stat></total></statistics></robot>' > results/output.xml
          fi

      - name: Record Robot test results with Smart Tests
        if: always()
        run: |
          smart-tests record tests robot --session @session-robot.txt results/output.xml

      - name: Upload Robot Framework results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: |
            results/
          retention-days: 30

      - name: Display test summary
        if: always()
        run: |
          if [ -f results/output.xml ]; then
            echo "=== Robot Framework Test Summary ==="
            python -c "
            import xml.etree.ElementTree as ET
            tree = ET.parse('results/output.xml')
            root = tree.getroot()
            stats = root.find('.//statistics/total/stat')
            if stats is not None:
              print(f\"Total: {stats.get('pass')} passed, {stats.get('fail')} failed\")
            " || echo "Could not parse results"
          fi

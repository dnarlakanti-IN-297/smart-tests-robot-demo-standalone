name: Robot Framework Tests (GitHub App)

# Smart Tests GitHub App Integration:
# ✅ Uses native Robot Framework profile (fixed in smart-tests-cli v2.11.1)
# ✅ Smart Tests CLI v2.11.1 for subset creation and recording
# ✅ GitHub App (cloudbees-oss/smart-tests-results-upload-action@v1) for results upload
# ✅ Supports observation and production modes
# 📚 GitHub App: https://github.com/cloudbees-oss/smart-tests-results-upload-action
# 📚 Documentation: https://docs.cloudbees.com/docs/cloudbees-smart-tests/latest/

on:
  push:
    branches: [ main, patch-robot-demo ]
    paths:
      - 'app/**'
      - 'tests/robot/**'
      - 'requirements.txt'
      - 'requirements-robot.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests/robot/**'
      - 'requirements.txt'
      - 'requirements-robot.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smart Tests mode'
        required: true
        type: choice
        default: 'observation'
        options:
          - observation
          - production
      target:
        description: 'Optimization target (e.g., --target 50%)'
        required: false
        default: '--target 80%'
        type: string

jobs:
  robot-api-tests:
    name: Robot Framework API Tests (GitHub App)
    runs-on: ubuntu-latest
    env:
      SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
      OBSERVATION_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'production' && ' ' || '--observation' }}
      TARGET_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.target || '--target 80%' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.1'
        cache: 'pip'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-robot.txt
        pip3 install --no-cache-dir smart-tests-cli==2.11.1

    - name: Verify Smart Tests connectivity
      run: |
        smart-tests verify || true

    - name: Record build with Smart Tests
      run: |
        smart-tests record build --build ${{ github.run_id }} --source ${{ github.repository }}=${{ github.workspace }}

    - name: Record session with Smart Tests
      run: |
        smart-tests record session --build ${{ github.run_id }} $OBSERVATION_FLAG --test-suite robot-api-github-app > session.txt
        cat session.txt
        echo "Mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'observation (default)' }}"
        echo "Target: $TARGET_FLAG"

    - name: Initialize database
      run: |
        python -m app.db.init_db
        python -m app.db.seed_data

    - name: Collect Robot Framework test names
      run: |
        mkdir -p /tmp/robot-dryrun
        robot --dryrun --outputdir /tmp/robot-dryrun tests/robot/ 2>/dev/null || true

        if [ -f "/tmp/robot-dryrun/output.xml" ]; then
          smart-tests subset robot --session @session.txt $TARGET_FLAG /tmp/robot-dryrun/output.xml > smart-tests-subset.txt 2>&1
          EXIT_CODE=$?
        else
          echo "Dry-run failed"
          EXIT_CODE=1
        fi

        if [ $EXIT_CODE -ne 0 ]; then
          echo "⚠️  Smart Tests subset failed, falling back to ALL tests"
          cat smart-tests-subset.txt
          echo "ALL" > smart-tests-subset.txt
        fi

        echo "Subset result:"
        cat smart-tests-subset.txt
        echo "Tests in subset: $(wc -l < smart-tests-subset.txt)"

    - name: Start application and run Robot tests
      continue-on-error: true
      run: |
        DEBUG=False uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        APP_PID=$!

        echo "Waiting for application to start..."
        timeout 30 bash -c 'until curl -f http://localhost:8000/health 2>/dev/null; do sleep 1; done' || {
          echo "Application failed to start"
          kill $APP_PID 2>/dev/null || true
          exit 1
        }
        echo "Application is ready!"

        mkdir -p test-results
        SUBSET_CONTENT=$(cat smart-tests-subset.txt)

        if [ -s smart-tests-subset.txt ] && [ "$SUBSET_CONTENT" != "ALL" ]; then
          SUBSET_COUNT=$(wc -l < smart-tests-subset.txt)
          echo "Running Robot Framework subset: $SUBSET_COUNT tests"

          TEST_ARGS=""
          while IFS= read -r test_name; do
            TEST_ARGS="$TEST_ARGS --test \"$test_name\""
          done < smart-tests-subset.txt

          echo "Running subset tests with Robot Framework"
          eval robot \
            --outputdir test-results \
            --output output.xml \
            --log log.html \
            --report report.html \
            --xunit junit.xml \
            --loglevel INFO \
            $TEST_ARGS \
            tests/robot/ || true
        else
          echo "Running all Robot Framework tests"
          robot \
            --outputdir test-results \
            --output output.xml \
            --log log.html \
            --report report.html \
            --xunit junit.xml \
            --loglevel INFO \
            tests/robot/ || true
        fi

        kill $APP_PID 2>/dev/null || true
      env:
        DATABASE_URL: sqlite:///./issue_tracker.db

    - name: Record test results with Smart Tests (CLI)
      if: always()
      run: |
        if [ -f test-results/output.xml ]; then
          echo "Recording test results to Smart Tests..."
          smart-tests record tests robot --session @session.txt test-results/output.xml
          echo "✅ Test results recorded to Smart Tests successfully!"
        else
          echo "❌ No output.xml found"
          ls -la test-results/ || echo "test-results directory not found"
          exit 1
        fi

    - name: Store Test Results for Smart Tests (GitHub App)
      if: always()
      uses: cloudbees-oss/smart-tests-results-upload-action@v1

    - name: Upload Robot Framework results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-results-github-app
        path: |
          test-results/
        retention-days: 30

    - name: Display test summary
      if: always()
      run: |
        if [ -f test-results/output.xml ]; then
          echo "=== Robot Framework Test Summary ==="
          python3 -c "
import xml.etree.ElementTree as ET
tree = ET.parse('test-results/output.xml')
root = tree.getroot()
stats = root.find('.//statistics/total/stat')
if stats is not None:
    print(f'Total: {stats.get(\"pass\")} passed, {stats.get(\"fail\")} failed')
" || echo "Could not parse test results"
        else
          echo "No test results found"
        fi

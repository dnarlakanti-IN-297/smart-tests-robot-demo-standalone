name: Robot Framework Tests (Quick - PTSv1)

# Launchable v1 Integration for Robot Framework (Quick - 40 tests, 0ms latency):
# ✅ Uses Launchable CLI v1.124.2
# ✅ 40 tests, 0ms latency — fast demo for PTSv1 warm-up
# ✅ Same pattern as full PTSv1 workflow
# 📚 Docs: https://help.launchableinc.com/features/predictive-test-selection/requesting-and-running-a-subset-of-tests/subsetting-with-the-launchable-cli/

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Launchable mode'
        required: true
        type: choice
        default: 'observation'
        options:
          - observation
          - production
      target:
        description: 'Optimization target percentage (e.g., 75%)'
        required: false
        default: '75%'
        type: string
  push:
    branches: [ patch-robot-demo-quick ]
    paths:
      - 'tests/robot/**'
      - '.github/workflows/tests-robot-launchable-pts-v1-quick.yml'

jobs:
  robot-launchable-tests:
    name: Robot Framework API Tests (PTSv1 Quick - 40 tests)
    runs-on: ubuntu-latest
    env:
      LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN }}
      BUILD_NAME: ${{ github.event.repository.name }}-${{ github.run_id }}
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || '75%' }}
      OBSERVATION_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'observation' && '--observation' || '' }}
      SIMULATED_LATENCY_MS: 0
      TEST_SUITE: tests/robot/data_driven/auth_edge_cases.robot

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.1'
        cache: 'pip'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-robot.txt
        pip install launchable==1.124.2

    - name: Verify Launchable connectivity
      run: |
        launchable verify || true

    - name: Record build with Launchable
      run: |
        launchable record build --name "$BUILD_NAME" --max-days 30

    - name: Record session with Launchable
      run: |
        launchable record session --build "$BUILD_NAME" $OBSERVATION_FLAG > session.txt
        echo "Session ID: $(cat session.txt)"
        echo "Mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'observation (default)' }}"
        echo "Target: $TARGET"

    - name: Dry-run to discover all tests
      run: |
        mkdir -p /tmp/launchable-dryrun
        robot --dryrun -o /tmp/launchable-dryrun/test_list.xml $TEST_SUITE 2>/dev/null || true

    - name: Get Launchable subset
      shell: bash
      run: |
        set +e
        SESSION_ID=$(cat session.txt)
        launchable subset \
          --session "$SESSION_ID" \
          --target "$TARGET" \
          --rest remaining-tests.txt \
          robot \
          /tmp/launchable-dryrun/test_list.xml > launchable-subset.txt 2>/tmp/subset-status.txt
        EXIT_CODE=$?
        cat /tmp/subset-status.txt || true
        set -e
        echo "=== Subset output ==="
        cat launchable-subset.txt || echo "(empty)"

    - name: Initialize database
      run: |
        python -m app.db.init_db
        python -m app.db.seed_data

    - name: Start application and run Robot tests
      continue-on-error: true
      run: |
        DEBUG=False uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        APP_PID=$!

        timeout 30 bash -c 'until curl -f http://localhost:8000/health 2>/dev/null; do sleep 1; done' || {
          kill $APP_PID 2>/dev/null || true
          exit 1
        }

        mkdir -p test-results
        SUBSET_CONTENT=$(cat launchable-subset.txt 2>/dev/null)

        if [ -n "$SUBSET_CONTENT" ]; then
          eval robot \
            --outputdir test-results \
            --output output.xml \
            --log log.html \
            --report report.html \
            --xunit junit.xml \
            --loglevel INFO \
            "$SUBSET_CONTENT" \
            $TEST_SUITE || true
        else
          robot \
            --outputdir test-results \
            --output output.xml \
            --log log.html \
            --report report.html \
            --xunit junit.xml \
            --loglevel INFO \
            $TEST_SUITE || true
        fi

        kill $APP_PID 2>/dev/null || true
      env:
        DATABASE_URL: sqlite:///./issue_tracker.db

    - name: Record test results with Launchable
      if: always()
      run: |
        if [ -f test-results/output.xml ]; then
          launchable record tests --session "$(cat session.txt)" robot test-results/output.xml
          echo "Test results recorded."
        else
          echo "No output.xml found"
          ls -la test-results/ || echo "test-results directory not found"
        fi

    - name: Display test summary
      if: always()
      run: |
        if [ -f test-results/output.xml ]; then
          echo "=== Robot Framework Test Summary ==="
          python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("test-results/output.xml").getroot(); s = root.find(".//statistics/total/stat"); print("Total: " + str(int(s.get("pass")) + int(s.get("fail"))) + " | Passed: " + str(s.get("pass")) + " | Failed: " + str(s.get("fail"))) if s is not None else None' || true
        fi

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-launchable-quick-results
        path: test-results/
        retention-days: 30

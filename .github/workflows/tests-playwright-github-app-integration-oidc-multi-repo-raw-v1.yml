name: Multi-Repo Playwright Tests (GitHub App - OIDC - Raw Profile - PTSv1)

# Multi-repo Scenario B — centralized Playwright test orchestration:
# ✅ Checks out smart-tests-multi-repo-demo (book library app + Playwright tests)
# ✅ Records build with --no-commit-collection --commit for BOTH repos
# ✅ Raw profile (subset raw / record tests raw)
# ✅ playwright test --list parsed to generate testPath list
# ✅ --grep pattern built from subset to run only selected tests
# ✅ GitHub OIDC auth — no SMART_TESTS_TOKEN secret required
# ⚠️  PTSv1 requires 3-5 observation runs before predictions appear
# 📚 Multi-repo docs: https://docs.cloudbees.com/docs/cloudbees-smart-tests/latest/send-data-to-smart-tests/record-builds/record-builds-from-multiple-repositories

on:
  push:
    branches: [ main, 'patch-playwright-multi-repo-raw' ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smart Tests mode'
        required: true
        type: choice
        default: 'observation'
        options:
          - observation
          - production
      optimization_target_type:
        description: 'Optimization target type: target (% of expected duration), confidence (Y-axis probability), time (X-axis fixed budget)'
        required: true
        type: choice
        default: 'target'
        options:
          - target
          - confidence
          - time
      optimization_target_value:
        description: 'Target value — % for target/confidence (e.g. 75%), or duration for time (e.g. 10m)'
        required: true
        default: '75%'
        type: string
      multi_repo_ref:
        description: 'Branch or SHA of smart-tests-multi-repo-demo to test against (default: patch-playwright-multi-repo-raw)'
        required: false
        default: 'patch-playwright-multi-repo-raw'
        type: string

jobs:
  multi-repo-playwright-raw-ptsv1:
    name: Multi-Repo Playwright Tests (Raw Profile - PTSv1)
    runs-on: runner-robot-demo

    permissions:
      id-token: write
      contents: read

    env:
      EXPERIMENTAL_GITHUB_OIDC_TOKEN_AUTH: 1
      SMART_TESTS_ORGANIZATION: ${{ vars.SMART_TESTS_ORGANIZATION_v1 }}
      SMART_TESTS_WORKSPACE: ${{ vars.SMART_TESTS_WORKSPACE_V1_PLAYWRIGHT_RAW }}
      OBSERVATION_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'observation' && '--observation' || ' ' }}
      TARGET_FLAG: ${{ github.event_name == 'workflow_dispatch' && format('--{0} {1}', inputs.optimization_target_type, inputs.optimization_target_value) || '--target 75%' }}
      SIMULATED_LATENCY_MS: 500

    steps:
    - name: Checkout smart-tests-robot-demo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout smart-tests-multi-repo-demo
      uses: actions/checkout@v4
      with:
        repository: anuddeeph2/smart-tests-multi-repo-demo
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.multi_repo_ref || 'patch-playwright-multi-repo-raw' }}
        token: ${{ secrets.MULTI_REPO_PAT }}
        path: multi-repo-app
        fetch-depth: 0

    - name: Get smart-tests-multi-repo-demo commit SHA
      id: multi-repo-sha
      run: echo "sha=$(git -C multi-repo-app rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.1'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r multi-repo-app/requirements.txt
        pip3 install --no-cache-dir smart-tests-cli==2.12.4

    - name: Install Playwright and dependencies
      working-directory: multi-repo-app
      run: |
        npm install
        npx playwright install chromium --with-deps

    - name: Verify Smart Tests connectivity
      run: smart-tests verify || true

    - name: Record commits with Smart Tests
      run: |
        smart-tests record commit --name ${{ github.repository }} --source ${{ github.workspace }} --max-days 90

    - name: Record build with Smart Tests (multi-repo)
      run: |
        smart-tests record build --build ${{ github.run_id }} \
          --no-commit-collection \
          --commit ${{ github.repository }}=${{ github.sha }} \
          --commit anuddeeph2/smart-tests-multi-repo-demo=${{ steps.multi-repo-sha.outputs.sha }}

    - name: Record session with Smart Tests
      run: |
        smart-tests record session --build ${{ github.run_id }} $OBSERVATION_FLAG --test-suite book-library-playwright-multi-repo-raw-v1 > session.txt
        cat session.txt
        echo "Mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'observation (default)' }}"
        echo "Target: $TARGET_FLAG"
        echo "Book library SHA: ${{ steps.multi-repo-sha.outputs.sha }}"

    - name: Initialize book library database
      working-directory: multi-repo-app
      run: |
        python -m app.db.init_db
        python -m app.db.seed_data

    - name: Generate testPath list from playwright --list (raw profile)
      shell: bash
      working-directory: multi-repo-app
      run: |
        echo "Collecting Playwright test titles from --list output..."
        # playwright --list writes to stderr; capture both streams to a file to avoid pipe+heredoc stdin conflict
        npx playwright test --list > /tmp/playwright_list.txt 2>&1 || true

        python3 <<'PYEOF'
        import re, os

        # Match "  api/auth.spec.ts:4:7 › Suite › Test Name" (no [browser] prefix)
        pattern = re.compile(r'^\s+(\S+\.spec\.ts):\d+:\d+\s+›\s+(.+)')
        paths = []
        seen = set()

        with open('/tmp/playwright_list.txt') as f:
            for line in f:
                m = pattern.search(line)
                if not m:
                    continue
                # testDir is tests/playwright/, prefix multi-repo-app/tests/playwright/ to match subset paths
                # paths relative to multi-repo-app/ (matching Robot approach — no multi-repo-app/ prefix)
                filepath = os.path.normpath(os.path.join('tests', 'playwright', m.group(1)))
                # Normalize › to " > " to match Playwright JSON results format
                full_title = m.group(2).strip().replace(' › ', ' > ')
                # Encode URL special chars that break testPath parsing (? = query separator)
                full_title = full_title.replace('%', '%25').replace('#', '%23').replace('=', '%3D').replace('?', '%3F').replace('&', '%26')
                key = f'file={filepath}#testcase={full_title}'
                if key not in seen:
                    seen.add(key)
                    paths.append(key)

        testpath_file = os.environ['GITHUB_WORKSPACE'] + '/testpath.txt'
        with open(testpath_file, 'w') as f:
            f.write('\n'.join(paths) + '\n')

        print(f'Generated {len(paths)} testPath entries')
        PYEOF

        echo "Sample testPath entries:"
        head -5 $GITHUB_WORKSPACE/testpath.txt
        echo "Total: $(wc -l < $GITHUB_WORKSPACE/testpath.txt) test paths"

    - name: Create Smart Tests subset (raw profile)
      shell: bash
      run: |
        set +e
        echo "Requesting raw subset from Smart Tests..."
        echo "Target flag: $TARGET_FLAG"
        echo "Input testpaths: $(wc -l < testpath.txt)"
        # stdout = subset result (clean); stderr = CLI logs (kept separate so logs never pollute the result)
        smart-tests subset raw --session @session.txt $TARGET_FLAG testpath.txt > smart-tests-subset.txt 2> subset-stderr.log
        EXIT_CODE=$?
        set -e
        echo "Exit code: $EXIT_CODE"
        echo "--- subset stderr (CLI logs) ---"
        cat subset-stderr.log || true
        echo "--- subset stdout (result) ---"
        cat smart-tests-subset.txt || true
        echo "--------------------------------"
        # Exit != 0 (observation mode / model still training) or empty result => run ALL tests
        if [ $EXIT_CODE -ne 0 ] || [ ! -s smart-tests-subset.txt ]; then
          echo "No usable subset returned; falling back to ALL tests"
          echo "ALL" > smart-tests-subset.txt
        fi
        echo "Subset lines: $(wc -l < smart-tests-subset.txt)"

    - name: Convert raw subset to Playwright --grep pattern
      shell: bash
      run: |
        SUBSET_CONTENT=$(cat smart-tests-subset.txt)
        if [ "$SUBSET_CONTENT" = "ALL" ] || [ ! -s smart-tests-subset.txt ]; then
          echo "PLAYWRIGHT_GREP=" >> $GITHUB_ENV
          echo "PLAYWRIGHT_FILES=" >> $GITHUB_ENV
          exit 0
        fi

        python3 - <<'PYEOF'
        import os, re

        def dec(s):
            # reverse the testpath percent-encoding so Playwright --grep matches the real titles
            return (s.replace('%3D', '=').replace('%3F', '?').replace('%26', '&')
                     .replace('%23', '#').replace('%25', '%'))

        input_count = 0
        if os.path.exists('testpath.txt'):
            with open('testpath.txt') as f:
                input_count = sum(1 for l in f if l.strip().startswith('file='))

        files = set()
        test_titles = []
        with open('smart-tests-subset.txt') as f:
            for line in f:
                line = line.strip()
                if not line.startswith('file='):
                    continue  # skip stray CLI messages / blank lines
                if '#testcase=' in line:
                    file_part, tc_part = line.split('#testcase=', 1)
                    files.add(file_part.replace('file=', '', 1))
                    test_titles.append(dec(tc_part))
                else:
                    files.add(line.replace('file=', '', 1))

        subset_count = len(test_titles) if test_titles else len(files)
        # A model still in training returns the full set: just run everything (skip fragile grep)
        run_all = subset_count == 0 or (input_count and subset_count >= input_count)

        with open(os.environ['GITHUB_ENV'], 'a') as env_f:
            if run_all:
                env_f.write('PLAYWRIGHT_GREP=\n')
                env_f.write('PLAYWRIGHT_FILES=\n')
            else:
                if test_titles:
                    env_f.write('PLAYWRIGHT_GREP=' + '|'.join(re.escape(t) for t in test_titles) + '\n')
                else:
                    env_f.write('PLAYWRIGHT_GREP=\n')
                env_f.write('PLAYWRIGHT_FILES=' + ' '.join(sorted(files)) + '\n')

        print(f'Input testpaths: {input_count}, subset: {subset_count}, run_all: {run_all}')
        print(f'Files: {sorted(files)}')
        PYEOF

    - name: Start book library app and run Playwright tests
      continue-on-error: true
      run: |
        cd multi-repo-app
        DEBUG=False uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        APP_PID=$!

        echo "Waiting for application to start..."
        timeout 30 bash -c 'until curl -f http://localhost:8000/health 2>/dev/null; do sleep 1; done' || {
          echo "Application failed to start"
          kill $APP_PID 2>/dev/null || true
          exit 1
        }
        echo "Application is ready!"

        mkdir -p test-results
        SUBSET_CONTENT=$(cat $GITHUB_WORKSPACE/smart-tests-subset.txt)

        if [ -s $GITHUB_WORKSPACE/smart-tests-subset.txt ] && [ "$SUBSET_CONTENT" != "ALL" ] && [ -n "$PLAYWRIGHT_FILES" ]; then
          echo "Running Playwright with raw subset (grep: $PLAYWRIGHT_GREP)"
          if [ -n "$PLAYWRIGHT_GREP" ]; then
            npx playwright test $PLAYWRIGHT_FILES --grep "$PLAYWRIGHT_GREP" || true
          else
            npx playwright test $PLAYWRIGHT_FILES || true
          fi
        else
          echo "Running all Playwright tests"
          npx playwright test || true
        fi

        cp -r test-results/. $GITHUB_WORKSPACE/test-results/ 2>/dev/null || true
        kill $APP_PID 2>/dev/null || true
      env:
        BASE_URL: http://localhost:8000
        DATABASE_URL: sqlite:///./library.db

    - name: Generate raw profile JSON results from Playwright JSON report
      if: always()
      run: |
        python3 - <<'PYEOF'
        import json, os, sys

        results_file = 'test-results/playwright-results.json'
        if not os.path.exists(results_file):
            print("No playwright-results.json found, skipping JSON generation")
            sys.exit(0)

        with open(results_file) as f:
            report = json.load(f)

        test_cases = []

        def process_suites(suites, filepath=None):
            for suite in suites:
                raw_file = suite.get('file')
                if raw_file is not None:
                    # file attr is relative to multi-repo-app/ (playwright testDir); use as-is
                    suite_file = os.path.normpath(raw_file)
                else:
                    suite_file = filepath  # inherited from parent suite
                title = suite.get('title', '')
                for spec in suite.get('specs', []):
                    spec_title = spec.get('title', '')
                    full_title = f'{title} > {spec_title}' if title else spec_title
                    # Encode URL special chars that break testPath parsing (? = query separator)
                    full_title = full_title.replace('%', '%25').replace('#', '%23').replace('=', '%3D').replace('?', '%3F').replace('&', '%26')
                    for test in spec.get('tests', []):
                        for result in test.get('results', []):
                            status = result.get('status', 'failed')
                            duration_ms = result.get('duration', 0)
                            test_cases.append({
                                'testPath': f'file={suite_file}#testcase={full_title}',
                                'status': 'TEST_PASSED' if status == 'passed' else 'TEST_FAILED',
                                'duration': duration_ms / 1000.0
                            })
                process_suites(suite.get('suites', []), suite_file)

        process_suites(report.get('suites', []))

        with open('test-results/raw-results.json', 'w') as f:
            json.dump({'testCases': test_cases}, f)
        print(f'Generated {len(test_cases)} test results in raw-results.json')
        PYEOF

    - name: Record test results with Smart Tests (raw profile)
      if: always()
      run: |
        if [ -f test-results/raw-results.json ]; then
          echo "Recording test results to Smart Tests (raw profile)..."
          smart-tests record tests raw --session @session.txt test-results/raw-results.json
          echo "Test results recorded successfully!"
        else
          echo "No raw-results.json found"
          ls -la test-results/ || echo "test-results directory not found"
          exit 1
        fi

    - name: Store Test Results for Smart Tests (GitHub App)
      if: always()
      uses: cloudbees-oss/smart-tests-results-upload-action@v1

    - name: Upload Playwright results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-results-multi-repo-raw-v1
        path: test-results/
        retention-days: 30

    - name: Display test summary
      if: always()
      run: |
        echo "=== Playwright Test Summary (Multi-Repo Raw Profile PTSv1) ==="
        echo "smart-tests-robot-demo SHA: ${{ github.sha }}"
        echo "smart-tests-multi-repo-demo SHA: ${{ steps.multi-repo-sha.outputs.sha }}"
        if [ -f test-results/raw-results.json ]; then
          python3 -c "
        import json
        with open('test-results/raw-results.json') as f:
            r = json.load(f)
        cases = r.get('testCases', [])
        passed = sum(1 for c in cases if c['status'] == 'TEST_PASSED')
        failed = sum(1 for c in cases if c['status'] == 'TEST_FAILED')
        print(f'{passed} passed, {failed} failed')
          "
        else
          echo "No test results found"
        fi

name: Apply CI Demo Patch

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - apply
          - revert
        default: 'apply'
      patch_name:
        description: 'Patch file name (e.g., 01-require-project-description.patch)'
        required: true
        type: string
        default: '01-require-project-description.patch'

jobs:
  apply-patch:
    name: Apply or Revert Patch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check branch protection
      run: |
        BRANCH="${{ github.ref_name }}"

        # Only allow branches that start with "patch-"
        if [[ ! "$BRANCH" =~ ^patch- ]]; then
          echo "❌ Error: This workflow can only run on branches starting with 'patch-'"
          echo ""
          echo "Current branch: $BRANCH"
          echo ""
          echo "To use this workflow:"
          echo "  1. Create a patch branch: git checkout -b patch-demo"
          echo "  2. Push it: git push -u origin patch-demo"
          echo "  3. Run this workflow from the patch-demo branch"
          echo ""
          echo "Allowed branch patterns: patch-*, patch-demo, patch-test, etc."
          exit 1
        fi

        echo "✅ Branch check passed: $BRANCH"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Verify patch exists
      run: |
        if [ ! -f "patches/${{ inputs.patch_name }}" ]; then
          echo "❌ Error: Patch file 'patches/${{ inputs.patch_name }}' not found"
          exit 1
        fi
        echo "✅ Found patch file: patches/${{ inputs.patch_name }}"
        echo ""
        echo "📄 Patch contents:"
        cat "patches/${{ inputs.patch_name }}"

    - name: Apply patch
      if: inputs.action == 'apply'
      run: |
        echo "🔧 Applying patch: ${{ inputs.patch_name }}"
        git apply "patches/${{ inputs.patch_name }}"

        echo ""
        echo "✅ Patch applied successfully!"
        echo ""
        echo "📝 Files changed:"
        git status --short

    - name: Revert patch
      if: inputs.action == 'revert'
      run: |
        echo "↩️  Reverting patch: ${{ inputs.patch_name }}"
        git apply -R "patches/${{ inputs.patch_name }}"

        echo ""
        echo "✅ Patch reverted successfully!"
        echo ""
        echo "📝 Files changed:"
        git status --short

    - name: Commit changes
      run: |
        # Check if there are changes to commit
        if [[ -z $(git status --porcelain) ]]; then
          echo "ℹ️  No changes to commit (patch may already be applied/reverted)"
          exit 0
        fi

        # Stage all changes
        git add -A

        # Create and commit with appropriate message
        if [ "${{ inputs.action }}" == "apply" ]; then
          git commit -m "Apply demo patch: ${{ inputs.patch_name }}" \
                     -m "This is a demonstration commit to showcase CI/CD behavior." \
                     -m "Patch: ${{ inputs.patch_name }}" \
                     -m "Action: Apply" \
                     -m "Triggered by: @${{ github.actor }}" \
                     -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        else
          git commit -m "Revert demo patch: ${{ inputs.patch_name }}" \
                     -m "This reverts the demonstration changes." \
                     -m "Patch: ${{ inputs.patch_name }}" \
                     -m "Action: Revert" \
                     -m "Triggered by: @${{ github.actor }}" \
                     -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi

        echo ""
        echo "✅ Changes committed"

    - name: Push changes
      run: |
        echo "🚀 Pushing changes to ${{ github.ref_name }}..."
        git push origin ${{ github.ref_name }}

        echo ""
        echo "✅ Changes pushed successfully!"
        echo ""
        if [ "${{ inputs.action }}" == "apply" ]; then
          echo "🎯 This will trigger the CI pipeline with the breaking changes"
        else
          echo "🎯 This will trigger the CI pipeline with the reverted code"
        fi

    - name: Summary
      run: |
        echo "## Demo Patch Workflow Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ inputs.action }}" == "apply" ]; then
          echo "**Action**: Applied" >> $GITHUB_STEP_SUMMARY
        else
          echo "**Action**: Reverted" >> $GITHUB_STEP_SUMMARY
        fi
        echo "**Patch**: \`${{ inputs.patch_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ inputs.action }}" == "apply" ]; then
          echo "### Expected CI Behavior" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Some tests will fail (intentionally)" >> $GITHUB_STEP_SUMMARY
          echo "- Smart Tests will select relevant test subsets" >> $GITHUB_STEP_SUMMARY
          echo "- Check the Tests workflow for results" >> $GITHUB_STEP_SUMMARY
        else
          echo "### Expected CI Behavior" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- All tests should pass" >> $GITHUB_STEP_SUMMARY
          echo "- Repository restored to working state" >> $GITHUB_STEP_SUMMARY
          echo "- Check the Tests workflow for results" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "View patch details: \`patches/README.md\`" >> $GITHUB_STEP_SUMMARY

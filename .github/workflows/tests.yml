name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip3 install --no-cache-dir smart-tests-cli~=2.0

    - name: Create test database
      run: |
        python -m app.db.init_db

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --cov=app --cov-append --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests,integration
        name: codecov-umbrella
      continue-on-error: true

  e2e-tests:
    name: E2E Tests with Playwright
    runs-on: ubuntu-latest
    env:
      SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip3 install --no-cache-dir smart-tests-cli~=2.0

    - name: Install Playwright browsers
      run: |
        playwright install --with-deps chromium

    - name: Verify Smart Tests connectivity
      run: |
        smart-tests verify || true

    - name: Record build with Smart Tests
      run: |
        smart-tests record build --build ${{ github.run_id }}

    - name: Record session with Smart Tests
      run: |
        smart-tests record session --build ${{ github.run_id }} --observation --test-suite playwright-e2e > session.txt
        cat session.txt

    - name: Initialize database
      run: |
        python -m app.db.init_db
        python -m app.db.seed_data

    - name: Start application
      run: |
        python run.py &
        sleep 5
        # Wait for application to be ready
        timeout 30 bash -c 'until curl -f http://localhost:8000/health 2>/dev/null; do sleep 1; done' || \
        timeout 30 bash -c 'until curl -f http://localhost:8000/ 2>/dev/null; do sleep 1; done'
      env:
        DATABASE_URL: sqlite:///./issue_tracker.db

    - name: Generate test list
      run: |
        find tests/e2e -name "test_*.py" > test_list.txt
        cat test_list.txt

    - name: Create Smart Tests subset
      run: |
        cat test_list.txt | smart-tests subset playwright --build ${{ github.run_id }} --session @session.txt --target 50% > smart-tests-subset.txt
        cat smart-tests-subset.txt

    - name: Run E2E tests (Smart Tests subset)
      run: |
        if [ -s smart-tests-subset.txt ]; then
          pytest $(cat smart-tests-subset.txt) -v --video=retain-on-failure --screenshot=only-on-failure --junit-xml=test-results/junit.xml
        else
          echo "No tests to run in subset"
        fi
      env:
        DATABASE_URL: sqlite:///./issue_tracker.db

    - name: Record test results with Smart Tests
      if: always()
      run: |
        smart-tests record tests playwright --session @session.txt "test-results"

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          test-results/
          playwright-report/
        retention-days: 7

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip3 install --no-cache-dir smart-tests-cli~=2.0

    - name: Run flake8
      run: |
        flake8 app/ tests/ --count --statistics
      continue-on-error: true

    - name: Check imports with isort
      run: |
        pip install isort
        isort --check-only --diff app/ tests/
      continue-on-error: true

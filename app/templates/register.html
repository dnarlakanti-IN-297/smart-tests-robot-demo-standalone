{% extends "base.html" %}

{% block title %}Register - Issue Tracker{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <h2>Register</h2>

    <div id="error-message"></div>

    <form id="register-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required minlength="3">
        </div>

        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6">
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <button type="submit" class="btn btn-primary">Register</button>
        <a href="/login" class="btn btn-secondary" style="margin-left: 1rem;">Login</a>
    </form>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const username = document.getElementById('username').value;
    const full_name = document.getElementById('full_name').value;
    const password = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;
    const errorDiv = document.getElementById('error-message');

    // Validate passwords match
    if (password !== confirm_password) {
        errorDiv.innerHTML = '<div class="alert alert-error">Passwords do not match</div>';
        return;
    }

    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, username, full_name, password })
        });

        if (response.ok) {
            errorDiv.innerHTML = '<div class="alert alert-success">Registration successful! Redirecting to login...</div>';
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        } else {
            const error = await response.json();
            errorDiv.innerHTML = `<div class="alert alert-error">${error.detail || 'Registration failed'}</div>`;
        }
    } catch (error) {
        errorDiv.innerHTML = '<div class="alert alert-error">An error occurred. Please try again.</div>';
    }
});
</script>
{% endblock %}

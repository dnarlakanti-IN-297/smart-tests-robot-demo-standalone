{% extends "base.html" %}

{% block title %}Login - Issue Tracker{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <h2>Login</h2>

    <div id="error-message"></div>

    <form id="login-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
        <a href="/register" class="btn btn-secondary" style="margin-left: 1rem;">Register</a>
    </form>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('error-message');

    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('username', username);

            errorDiv.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';
            setTimeout(() => {
                window.location.href = '/projects';
            }, 1000);
        } else {
            const error = await response.json();
            errorDiv.innerHTML = `<div class="alert alert-error">${error.detail || 'Login failed'}</div>`;
        }
    } catch (error) {
        errorDiv.innerHTML = '<div class="alert alert-error">An error occurred. Please try again.</div>';
    }
});
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}Projects - Issue Tracker{% endblock %}

{% block content %}
<div class="card">
    <h2>My Projects</h2>

    <div style="margin-bottom: 2rem;">
        <button class="btn btn-primary" onclick="showCreateProjectModal()">Create Project</button>
    </div>

    <div id="projects-list" class="loading">Loading projects...</div>
</div>

<!-- Create Project Modal -->
<div id="create-project-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div class="card" style="max-width: 500px; margin: 5rem auto;">
        <h2>Create Project</h2>
        <div id="modal-error"></div>
        <form id="create-project-form">
            <div class="form-group">
                <label for="name">Project Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="key">Project Key (2-10 uppercase letters/numbers)</label>
                <input type="text" id="key" required pattern="[A-Z0-9]{2,10}" style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Create</button>
            <button type="button" class="btn btn-secondary" onclick="hideCreateProjectModal()">Cancel</button>
        </form>
    </div>
</div>

<script>
async function loadProjects() {
    const projectsList = document.getElementById('projects-list');

    try {
        // Add a small delay to ensure token is available after redirect
        await new Promise(resolve => setTimeout(resolve, 100));

        const response = await apiRequest('/api/projects');

        if (!response || !response.ok) {
            projectsList.innerHTML = '<div class="alert alert-error">Failed to load projects. Please <a href="/login">login</a>.</div>';
            return;
        }

        const projects = await response.json();

        if (projects.length === 0) {
            projectsList.innerHTML = '<p>No projects yet. Create your first project!</p>';
            return;
        }

        projectsList.innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${projects.map(project => `
                        <tr>
                            <td><strong>${project.key}</strong></td>
                            <td>${project.name}</td>
                            <td>${project.description || '-'}</td>
                            <td>${new Date(project.created_at).toLocaleDateString()}</td>
                            <td><a href="/projects/${project.id}/issues" class="btn btn-primary" style="padding: 0.5rem 1rem;">View Issues</a></td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    } catch (error) {
        console.error('Error loading projects:', error);
        projectsList.innerHTML = `<div class="alert alert-error">An error occurred loading projects: ${error.message}</div>`;
    }
}

function showCreateProjectModal() {
    document.getElementById('create-project-modal').style.display = 'block';
}

function hideCreateProjectModal() {
    document.getElementById('create-project-modal').style.display = 'none';
    document.getElementById('create-project-form').reset();
    document.getElementById('modal-error').innerHTML = '';
}

document.getElementById('create-project-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value;
    const key = document.getElementById('key').value.toUpperCase();
    const description = document.getElementById('description').value;
    const errorDiv = document.getElementById('modal-error');

    try {
        const response = await apiRequest('/api/projects', {
            method: 'POST',
            body: JSON.stringify({ name, key, description })
        });

        if (response && response.ok) {
            hideCreateProjectModal();
            loadProjects();
        } else {
            const error = await response.json();
            errorDiv.innerHTML = `<div class="alert alert-error">${error.detail || 'Failed to create project'}</div>`;
        }
    } catch (error) {
        errorDiv.innerHTML = '<div class="alert alert-error">An error occurred.</div>';
    }
});

// Load projects when page is ready
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadProjects);
} else {
    // DOM already loaded
    loadProjects();
}
</script>
{% endblock %}
